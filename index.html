<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এসআরকে গ্যাজেট টেলিকম</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- SweetAlert2 CDN for modern popup boxes -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">এসআরকে গ্যাজেট টেলিকম</h1>
                <p class="text-xs text-blue-100">পাসপোর্ট, স্টুডিও ও সার্ভিসিং পয়েন্ট</p>
            </div>
            <div>
                <button id="modeToggleBtn" onclick="toggleMode()" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-1.5 shadow">
                    <span id="modeIcon">🔒</span>
                    <span id="modeText">এমপ্লয়ী মোড (লকড)</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-6">
        <!-- Tab Navigation -->
        <div class="flex gap-2 overflow-x-auto pb-2 mb-4">
            <button class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">ডিজিটাল মেমো (POS)</button>
            <button class="bg-white text-gray-700 px-4 py-2 rounded-lg text-sm font-medium border border-gray-300 whitespace-nowrap">প্রোডাক্ট ও ক্যাশিয়ার</button>
            <button class="bg-white text-gray-700 px-4 py-2 rounded-lg text-sm font-medium border border-gray-300 whitespace-nowrap">সার্ভিসিং ও রিপ্রিয়ার</button>
        </div>

        <!-- POS Form Section -->
        <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-200">
            <h2 class="text-base font-bold text-gray-800 mb-3">পণ্য বিক্রয় ও মেমো</h2>
            
            <div class="grid grid-cols-2 gap-2 mb-4">
                <button class="bg-blue-50 text-blue-600 border border-blue-200 py-2 rounded-lg text-sm font-medium">প্যাকিংরি মোড</button>
                <button class="bg-gray-50 text-gray-600 border border-gray-200 py-2 rounded-lg text-sm font-medium">খুচরা মোড</button>
            </div>

            <div class="flex gap-2 mb-4">
                <input type="text" placeholder="পণ্যের নাম লিখে সার্চ করুন..." class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                <select class="border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:border-blue-500">
                    <option>সকল ক্যাটাগরি</option>
                </select>
            </div>

            <div class="border-t border-gray-200 pt-4 mt-4">
                <h3 class="text-sm font-bold text-gray-700 mb-3">গ্রাহক ও বিল বিবরণী</h3>
                
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">কাউন্টারের নাম <span class="text-red-500">*</span></label>
                        <input type="text" placeholder="নাম লিখুন" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">ফোন নাম্বার <span class="text-red-500">*</span></label>
                        <input type="tel" placeholder="০১৭১XXXXXXXX" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                    </div>

                    <div>
                        <select class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white text-gray-500 focus:outline-none focus:border-blue-500">
                            <option>কোনো কন্যা রোম করা হয়নি</option>
                        </select>
                    </div>

                    <div class="bg-gray-50 p-3 rounded-lg space-y-2 border border-gray-200 text-sm">
                        <div class="flex justify-between font-medium text-gray-700">
                            <span>মোট বিল:</span>
                            <span>৳ ০</span>
                        </div>
                        <div class="flex justify-between items-center font-medium text-gray-700">
                            <span>নগদ প্রদান:</span>
                            <input type="number" value="0" class="w-24 border border-gray-300 rounded px-2 py-1 text-right text-sm bg-white">
                        </div>
                        <div class="flex justify-between font-medium text-red-600">
                            <span>বাকি / পাওনা:</span>
                            <span>৳ ০</span>
                        </div>
                    </div>

                    <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm shadow transition">
                        মেমো তৈরি ও প্রিন্ট করুন
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Script for PIN Authentication using SweetAlert2 -->
    <script>
        let isOwnerMode = false;
        const correctPin = "1234"; // তোমার পিন নাম্বার এখানে সেট করা আছে, প্রয়োজনে পরিবর্তন করতে পারো

        function toggleMode() {
            if (!isOwnerMode) {
                // Unlock prompt
                Swal.fire({
                    title: 'ওনার মোড আনলক করুন',
                    input: 'password',
                    inputAttributes: {
                        maxlength: 4,
                        autocapitalize: 'off',
                        autocorrect: 'off'
                    },
                    inputPlaceholder: '৪ ডিজিটের পিন দিন',
                    showCancelButton: true,
                    confirmButtonText: 'আনলক',
                    cancelButtonText: 'বাতিল',
                    confirmButtonColor: '#2563eb',
                }).then((result) => {
                    if (result.isConfirmed) {
                        if (result.value === correctPin) {
                            isOwnerMode = true;
                            document.getElementById('modeIcon').innerText = '🔓';
                            document.getElementById('modeText').innerText = 'ওনার মোড (আনলকড)';
                            document.getElementById('modeToggleBtn').classList.remove('bg-amber-500', 'hover:bg-amber-600');
                            document.getElementById('modeToggleBtn').classList.add('bg-green-600', 'hover:bg-green-750');
                            Swal.fire('সফল!', 'ওনার মোড সফলভাবে আনলক হয়েছে।', 'success');
                        } else {
                            Swal.fire('ভুল পিন!', 'সঠিক ৪ ডিজিটের পিন দিয়ে আবার চেষ্টা করুন।', 'error');
                        }
                    }
                });
            } else {
                // Lock back to employee mode
                isOwnerMode = false;
                document.getElementById('modeIcon').innerText = '🔒';
                document.getElementById('modeText').innerText = 'এমপ্লয়ী মোড (লকড)';
                document.getElementById('modeToggleBtn').classList.remove('bg-green-600', 'hover:bg-green-750');
                document.getElementById('modeToggleBtn').classList.add('bg-amber-500', 'hover:bg-amber-600');
                Swal.fire({
                    icon: 'info',
                    title: 'লক করা হয়েছে',
                    text: 'এমপ্লয়ী মোডে ফিরে যাওয়া হয়েছে।',
                    timer: 1500,
                    showConfirmButton: false
                });
            }
        }
    </script>
</body>
</html>
